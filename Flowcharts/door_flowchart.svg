<text x="60.000" y="9.450">Start</text>
<text x="60.000" y="40.250">Probuď vše</text>
<text x="60.000" y="45.550">potřebné</text>
<text x="60.000" y="89.750">Jsou dvířka</text>
<text x="60.000" y="95.050">porouchaná?</text>
<text x="69.500" y="117.500" text-anchor="start">NE</text>
<text x="155.000" y="89.750">Máš příkaz</text>
<text x="155.000" y="95.050">od uživatele?</text>
<text x="94.600" y="87.500" text-anchor="start">ANO</text>
<text x="155.000" y="139.250">Nastav dvířka</text>
<text x="155.000" y="144.550">jako funkční</text>
<text x="164.500" y="117.500" text-anchor="start">ANO</text>
<text x="189.600" y="87.500" text-anchor="start">NE</text>
<text x="60.000" y="188.750">Jsou dvířka</text>
<text x="60.000" y="194.050">v krajní poloze?</text>
<text x="69.500" y="216.500" text-anchor="start">ANO</text>
<text x="94.600" y="186.500" text-anchor="start">NE</text>
<text x="60.000" y="240.900">Zapni motor</text>
<text x="60.000" y="276.850">Počkej na</text>
<text x="60.000" y="282.150">rozběh motoru</text>
<text x="60.000" y="318.100">Uprav střídu PWM</text>
<text x="60.000" y="354.050">Navzorkuj napětí</text>
<text x="60.000" y="359.350">a proud</text>
<text x="60.000" y="403.550">Je proud</text>
<text x="60.000" y="408.850">příliš vysoký?</text>
<text x="69.500" y="431.300" text-anchor="start">NE</text>
<text x="60.000" y="463.950">Běží motor</text>
<text x="60.000" y="469.250">příliš dlouho?</text>
<text x="69.500" y="491.700" text-anchor="start">NE</text>
<text x="60.000" y="524.350">Je úkon</text>
<text x="60.000" y="529.650">dokončen?</text>
<text x="69.500" y="552.100" text-anchor="start">ANO</text>
<text x="25.400" y="522.100" text-anchor="end">NE</text>
<text x="60.000" y="576.500">Vypni motor</text>
<text x="155.000" y="403.550">Je to jen</text>
<text x="155.000" y="408.850">krátká špička?</text>
<text x="94.600" y="401.300" text-anchor="start">ANO</text>
<text x="164.500" y="380.300" text-anchor="start">ANO</text>
<text x="155.000" y="455.700">Zastav motor</text>
<text x="164.500" y="431.300" text-anchor="start">NE</text>
<text x="155.000" y="491.650">Počkej na</text>
<text x="155.000" y="496.950">zastavení</text>
<text x="155.000" y="541.150">Zbývají ještě</text>
<text x="155.000" y="546.450">pokusy?</text>
<text x="235.000" y="541.150">Naplánuj</text>
<text x="235.000" y="546.450">nový pokus</text>
<text x="189.600" y="538.900" text-anchor="start">ANO</text>
<text x="235.000" y="579.750">Obrať směr</text>
<text x="235.000" y="585.050">tahu</text>
<text x="155.000" y="618.350">Nastav dvířka</text>
<text x="155.000" y="623.650">na porouchaná</text>
<text x="164.500" y="568.900" text-anchor="start">NE</text>
<text x="94.600" y="461.700" text-anchor="start">ANO</text>
<text x="60.000" y="676.000">Odešli data</text>
<text x="60.000" y="711.950">Uspi vše</text>
<text x="60.000" y="717.250">používané</text>
<text x="60.000" y="748.050">Konec</text>
