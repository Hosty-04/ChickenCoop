  <g fill="#000000" stroke="none" font-family="'Open Sans', sans-serif" font-size="4.23333" text-anchor="middle">
<text x="37.000" y="9.450">Start</text>
<text x="37.000" y="40.250">Probuď vše</text>
<text x="37.000" y="45.550">potřebné</text>
<text x="37.000" y="78.850">Počkej na</text>
<text x="37.000" y="84.150">ustálení váhy</text>
<text x="37.000" y="120.100">Odeber vzorky</text>
<text x="37.000" y="158.700">Vypočti medián</text>
<text x="37.000" y="194.650">Vyber vzorky</text>
<text x="37.000" y="199.950">nejblíže mediánu</text>
<text x="37.000" y="233.250">Vypočti hmotnost</text>
<text x="37.000" y="238.550">a odchylku</text>
<text x="37.000" y="282.750">Je v hnízdě</text>
<text x="37.000" y="288.050">slepice?</text>
<text x="46.500" y="310.500" text-anchor="start">NE</text>
<text x="117.000" y="285.400">Zahoď měření</text>
<text x="71.600" y="280.500" text-anchor="start">ANO</text>
<text x="197.000" y="282.750">Sedí tam slepice</text>
<text x="197.000" y="288.050">opakovaně?</text>
<text x="197.000" y="334.900">Označ kvočnu</text>
<text x="206.500" y="310.500" text-anchor="start">ANO</text>
<text x="231.600" y="280.500" text-anchor="start">NE</text>
<text x="37.000" y="376.350">Je měření</text>
<text x="37.000" y="381.650">stabilní?</text>
<text x="46.500" y="404.100" text-anchor="start">ANO</text>
<text x="117.000" y="379.000">Zahoď měření</text>
<text x="71.600" y="374.100" text-anchor="start">NE</text>
<text x="37.000" y="436.750">Je hnízdo</text>
<text x="37.000" y="442.050">prázdné?</text>
<text x="46.500" y="464.500" text-anchor="start">NE</text>
<text x="117.000" y="436.750">Vynuluj počet</text>
<text x="117.000" y="442.050">vajec</text>
<text x="71.600" y="434.500" text-anchor="start">ANO</text>
<text x="197.000" y="436.750">Proběhla dnes</text>
<text x="197.000" y="442.050">kontrola driftu?</text>
<text x="231.600" y="434.500" text-anchor="start">ANO</text>
<text x="197.000" y="486.250">Zkontroluj drift</text>
<text x="197.000" y="491.550">a oprav nulu</text>
<text x="206.500" y="464.500" text-anchor="start">NE</text>
<text x="37.000" y="530.350">Přibylo nebo</text>
<text x="37.000" y="535.650">ubylo vejce?</text>
<text x="46.500" y="558.100" text-anchor="start">ANO</text>
<text x="71.600" y="528.100" text-anchor="start">NE</text>
<text x="37.000" y="579.850">Přičti nebo</text>
<text x="37.000" y="585.150">odečti vejce</text>
<text x="37.000" y="632.000">Je košík plný?</text>
<text x="46.500" y="657.100" text-anchor="start">NE</text>
<text x="117.000" y="629.350">Označ košík</text>
<text x="117.000" y="634.650">jako plný</text>
<text x="71.600" y="627.100" text-anchor="start">ANO</text>
<text x="37.000" y="678.850">Odešli počet</text>
<text x="37.000" y="684.150">vajec</text>
<text x="37.000" y="717.450">Uspi vše</text>
<text x="37.000" y="722.750">používané</text>
<text x="37.000" y="753.550">Konec</text>
  </g>
